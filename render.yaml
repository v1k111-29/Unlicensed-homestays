# Render Blueprint (M11, D85). NOT APPLIED: the human creates the Render account and applies
# this file by following docs/deploy-runbook.md. Free-tier behaviour and limits are [A] (Q9).
#
# Environment variable NAMES only. Secrets are never written here:
# - `sync: false`  -> Render asks for the value when the Blueprint is first applied;
# - `generateValue: true` -> Render generates a random value once (DJANGO_SECRET_KEY).
services:
  - type: web
    name: verified-stays
    runtime: docker
    plan: free
    # Closest region to Tamil Nadu offered by Render [A]; no India region (Q1).
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Liveness only: Render polls this often; /healthz (database) would keep Neon awake (D81).
    healthCheckPath: /livez
    # Deploys are started by hand (dashboard) until the CI deploy job is enabled (D86).
    autoDeploy: false
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_DEBUG
        value: "0"
      # Render's proxy appends the client address to X-Forwarded-For [A]; verify (Q41).
      - key: DJANGO_CLIENT_IP_HEADER
        value: HTTP_X_FORWARDED_FOR
      - key: DJANGO_TRUSTED_PROXY_HOPS
        value: "1"
      - key: DJANGO_LOG_LEVEL
        value: INFO
      # 512 MB free instance [A]: two Gunicorn workers.
      - key: WEB_CONCURRENCY
        value: "2"
